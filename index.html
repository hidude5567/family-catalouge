<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Catalog — a running record of what's on the shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>
<!--recach-->

<!-- ============ AUTH GATE ============ -->
<div class="auth-shell" id="authGate" hidden>
  <div class="auth-card">
    <h1 class="masthead-title auth-title">The Catalog</h1>
    <p class="masthead-sub auth-sub">a running record of what's on the shelf</p>
    <div class="auth-tabs" role="tablist">
      <button type="button" class="auth-tab active" id="tabLogin" role="tab" aria-selected="true">Log in</button>
      <button type="button" class="auth-tab" id="tabSignup" role="tab" aria-selected="false">Sign up</button>
    </div>
    <form id="authForm">
      <div class="field">
        <label for="authUser">Username</label>
        <input id="authUser" type="text" autocomplete="username" required autocapitalize="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="authPass">Password</label>
        <input id="authPass" type="password" autocomplete="current-password" required minlength="6">
      </div>
      <div class="field-error" id="authError" style="display:none;"></div>
      <button type="submit" class="btn btn-primary" id="authSubmit">Log in</button>
    </form>
    <p class="status-line" id="authStatus"></p>
    <p class="auth-footnote" id="authFootnote">Each account keeps its own shelf — nobody sees anyone else's books.</p>
  </div>
</div>

<div class="page" id="appShell" hidden>
  <header class="masthead">
    <div>
      <h1 class="masthead-title">The Catalog</h1>
      <p class="masthead-sub">a running record of what's on the shelf</p>
    </div>
    <div class="header-actions">
      <span class="mono whoami" id="whoami"></span>
      <button class="btn btn-ghost" id="logoutBtn" hidden>Log out</button>
      <button class="new-book-btn" id="openCreate">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="label">New book</span>
      </button>
    </div>
  </header>

  <div class="search-row">
    <div class="search-field">
      <svg viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.6"/><path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input type="text" id="searchInput" placeholder="Search by title, author, or genre…" aria-label="Search books">
    </div>
    <select id="genreFilter" class="genre-filter" aria-label="Filter by genre">
      <option value="">All genres</option>
    </select>
  </div>
  <p class="shelf-count" id="shelfCount"></p>

  <div class="grid" id="grid"></div>

  <p class="sync-note" id="syncNote"></p>
</div>

<!-- ============ CREATE MODAL ============ -->
<div class="overlay" id="overlay" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="Close">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
